# Compile et publie Relais Distant à chaque version (tag v*) :
# app Windows (.exe, .msi), Linux (.AppImage, .deb), macOS (.dmg), Android (.apk) et agent Mac (.zip).
name: Apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Plateformes à compiler"
        type: choice
        options: [all, android]
        default: all

permissions:
  contents: write

jobs:
  desktop:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Dépendances Linux
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Relais Distant ${{ github.ref_name }}"
          releaseBody: "Téléchargements ci-dessous. Mode d'emploi : https://github.com/${{ github.repository }}/blob/main/docs/MODE-EMPLOI.md"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  agent-mac:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compiler l'agent
        run: INSTALL=0 ./scripts/bundle-mac.sh
      - run: cd dist && ditto -c -k --keepParent "Relais Distant Agent.app" "Relais-Distant-Agent-macOS.zip"
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: dist/Relais-Distant-Agent-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agent-mac
          path: dist/Relais-Distant-Agent-macOS.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Le SDK Android est déjà installé sur les machines GitHub : on ajoute seulement le NDK.
      - name: NDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - run: npm ci
        working-directory: app
      - name: Compiler l'APK (version optimisée, ARM 64 bits)
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64
      - name: Signer l'APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find app/src-tauri/gen/android -name '*release*.apk' | head -1)"
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias relais --ks-pass env:KEY_PASS --key-pass env:KEY_PASS --out Relais-Distant-Android.apk aligned.apk
          "$BT/apksigner" verify Relais-Distant-Android.apk
          rm -f release.jks
          ls -la Relais-Distant-Android.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          files: Relais-Distant-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Relais-Distant-Android.apk
