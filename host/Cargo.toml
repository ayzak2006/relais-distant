[package]
name = "relais-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "relais-distant"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webrtc = "0.21"
rtc = "0.21"
async-trait = "0.1"
bytes = "1"
screencapturekit = "11"
tray-icon = "0.26"
tao = "0.37"
qrcode = "0.14"
rand = "0.8"
base64 = "0.22"
anyhow = "1"
